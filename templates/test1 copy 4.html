<form id="predictForm">
  <input type="text" id="commune" name="Commune" placeholder="Commune">
  <input type="text" id="quartier" name="Quartier" placeholder="Quartier">
  <input type="number" id="chambre" name="Chambre" placeholder="Nombre de chambres">
  <input type="number" id="cuisine" name="Cuisine" placeholder="Cuisine">
  <input type="number" id="salon" name="Salon" placeholder="Salon">
  <input type="number" id="toilette" name="Toilette int" placeholder="Toilette intérieure">
  <input type="number" id="design" name="Design" placeholder="Design (score)">
  <button type="submit">Prédire le prix</button>
</form>

<div id="resultat"></div>


<script>
document.getElementById("predictForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        Commune: document.getElementById("commune").value,
        Quartier: document.getElementById("quartier").value,
        Chambre: parseInt(document.getElementById("chambre").value),
        Cuisine: parseInt(document.getElementById("cuisine").value),
        Salon: parseInt(document.getElementById("salon").value),
        "Toilette int": parseInt(document.getElementById("toilette").value),
        Design: parseInt(document.getElementById("design").value),
    };

    const response = await fetch("http://127.0.0.1:5000/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    if (result.prix_estime) {
        document.getElementById("resultat").innerHTML = 
            `<h3>💰 Prix estimé : ${result.prix_estime.toLocaleString()} USD</h3>`;
    } else {
        document.getElementById("resultat").innerHTML = 
            `<p style="color:red;">Erreur : ${result.error}</p>`;
    }
});
</script>
